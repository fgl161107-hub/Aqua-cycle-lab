<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kondensasi</title><link rel="stylesheet" href="style.css"><body><main><header>💧 AQUA-CYCLE <b>LAB 3.0</b><span id=xp></span></header><div class=bar><i id=p></i></div><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:15px"><span class="option" style="padding:7px;font-size:11px">1. Mulai</span><span class="option" style="padding:7px;font-size:11px">2. Eksplorasi</span><span class="option" style="padding:7px;font-size:11px">3. Evaporasi</span><span class="option" style="padding:7px;font-size:11px">4. Kondensasi</span><span class="option" style="padding:7px;font-size:11px">5. Hujan</span><span class="option" style="padding:7px;font-size:11px">6. Daratan</span><span class="option" style="padding:7px;font-size:11px">7. Rakit</span><span class="option" style="padding:7px;font-size:11px">8. Detektif</span><span class="option" style="padding:7px;font-size:11px">9. Final</span></div><section class=card><small>MISI 3 · CLOUD LAB</small><h2>Bentuk titik air ☁️</h2><p>Naikkan pendinginan lalu amati terbentuknya titik air.</p><input id=cool type=range min=0 max=100 value=50><b id=cv>50</b>%<div class=scene id=sky>☁️</div><button id=obs>Amati</button><p id=d></p><div id=f></div></section></main><script src=app.js></script><script>guard('m2');cool.oninput=()=>cv.textContent=cool.value;obs.onclick=()=>{let n=Math.floor(cool.value/14);d.textContent='Titik air terbentuk: '+n;if(n>=4){done('m3',25);f.className='feedback ok';f.textContent='Benar! Pendinginan membuat uap mengembun.';go('m4')}else{f.className='feedback bad';f.textContent='Naikkan pendinginan dan coba lagi.'}}</script></body></html>
