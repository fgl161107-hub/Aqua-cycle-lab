<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b78c8">
  <title>SAGE-AI | Laboratorium Sains Digital</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand" onclick="App.go('home')">
        <div class="brand-mark">🌿</div>
        <div>
          <strong>SAGE-AI</strong>
          <small>Smart Adaptive Guide</small>
        </div>
      </div>
      <div class="top-progress">
        <span id="progressLabel">0% perjalanan</span>
        <div class="progress"><i id="progressBar"></i></div>
      </div>
      <button class="icon-btn" onclick="App.reset()" title="Mulai dari awal">↻</button>
    </header>

    <main id="screen"></main>

    <nav class="bottom-nav" id="bottomNav">
      <button onclick="App.go('home')" data-nav="home">🏠<span>Beranda</span></button>
      <button onclick="App.go('world')" data-nav="world">🌎<span>Dunia Air</span></button>
      <button onclick="App.go('lab')" data-nav="lab">🔬<span>Lab</span></button>
      <button onclick="App.go('challenge')" data-nav="challenge">🧠<span>Tantangan</span></button>
      <button onclick="App.go('profile')" data-nav="profile">🏆<span>Profil</span></button>
    </nav>
  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <button class="modal-close" onclick="UI.closeModal()">×</button>
      <div id="modalContent"></div>
    </div>
  </div>
  <script src="data.js"></script>
  <script src="sage.js"></script>
  <script src="simulation.js"></script>
  <script src="app.js"></script>
</body>
</html>
