<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tahap 8 | Tantangan Akhir</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><div class="wrap"><div class="brand">AQUA-CYCLE LAB<small>Perjalanan Pembelajaran IPA</small></div><div><span id="player"></span> · <span id="xp"></span></div></div><div class="progress"><span id="bar"></span></div></header><main class="wrap"><div class="stage">Tahap 8 dari 8 · Tantangan Akhir</div><section class="card"><h2>Uji Pemahaman</h2><p class="lead">Jawab lima pertanyaan berikut untuk menyelesaikan perjalanan belajar.</p><div id="quiz"></div><div id="fb" class="feedback"></div><div class="actions"><button class="btn" id="finish" disabled>Lihat Hasil Akhir</button></div></section></main><script src="app.js"></script><script>if(guard('m8')){header(8);const qs=[['Proses perubahan air cair menjadi uap disebut…',['Kondensasi','Evaporasi','Presipitasi'],'Evaporasi'],['Uap air yang mendingin dapat berubah menjadi…',['Titik-titik air','Tanah','Batuan'],'Titik-titik air'],['Air yang jatuh dari awan ke permukaan disebut…',['Infiltrasi','Presipitasi','Transpirasi'],'Presipitasi'],['Air yang masuk ke dalam tanah melalui pori-pori disebut…',['Infiltrasi','Evaporasi','Kondensasi'],'Infiltrasi'],['Permukaan beton cenderung…',['Memperbesar infiltrasi','Mengurangi aliran permukaan','Mengurangi infiltrasi'],'Mengurangi infiltrasi']];let idx=0,score=0;const qbox=document.getElementById('quiz');function render(){if(idx>=qs.length){document.getElementById('finish').disabled=false;document.getElementById('fb').className='feedback show ok';document.getElementById('fb').textContent='Tantangan selesai. Nilai: '+score+'/'+qs.length;return}const q=qs[idx];qbox.innerHTML='<h3>'+ (idx+1)+'. '+q[0]+'</h3>'+q[1].map(x=>'<button class="choice">'+x+'</button>').join('');qbox.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{const good=b.textContent===q[2];if(good)score++;qbox.querySelectorAll('.choice').forEach(x=>x.disabled=true);b.classList.add(good?'correct':'wrong');setTimeout(()=>{idx++;render()},450)})}render();document.getElementById('finish').onclick=()=>{let s=complete('m8',30);s.score=score;s.answers=[score,5-score];save(s);go('hasil')}}</script></body></html>
