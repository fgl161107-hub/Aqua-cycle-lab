ned)){f.className='feedback bad';f.textContent='Jawab semua pertanyaan.';return}let sc=ans.reduce((n,a,i)=>n+(a==qs[i][2]),0),s=get();s.final=sc;s.done.m8=1;s.xp+=sc*15;put(s);location='hasil.html'}</script></body></html>
