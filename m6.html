<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tahap 6 | Rangkaian</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><div class="wrap"><div class="brand">AQUA-CYCLE LAB<small>Perjalanan Pembelajaran IPA</small></div><div><span id="player"></span> · <span id="xp"></span></div></div><div class="progress"><span id="bar"></span></div></header><main class="wrap"><div class="stage">Tahap 6 dari 8 · Penyusunan</div><section class="card"><h2>Susun Rangkaian Siklus Air</h2><p class="lead">Pilih tahapan secara berurutan untuk membentuk satu rangkaian siklus yang logis.</p><div id="choices"></div><div class="timeline" id="sequence"></div><div id="fb" class="feedback"></div><div class="actions"><button class="btn" id="reset">Ulangi</button><button class="btn" id="next" disabled>Lanjut ke Investigasi</button></div></section></main><script src="app.js"></script><script>if(guard('m6')){header(6);const correct=['Evaporasi','Kondensasi','Presipitasi','Infiltrasi dan aliran permukaan'];let seq=[];const box=document.getElementById('choices'),out=document.getElementById('sequence');correct.forEach(x=>{const b=document.createElement('button');b.className='choice';b.textContent=x;b.onclick=()=>{if(seq.includes(x))return;seq.push(x);render();if(seq.length===correct.length){const good=seq.every((v,i)=>v===correct[i]);const f=document.getElementById('fb');f.className='feedback show '+(good?'ok':'no');f.textContent=good?'Urutan tepat. Kamu telah menghubungkan proses utama dalam siklus air.':'Urutan belum tepat. Ulangi dan perhatikan hubungan antarproses.';document.getElementById('next').disabled=!good}};box.appendChild(b)});function render(){out.innerHTML=seq.map((x,i)=>'<div><strong>'+(i+1)+'.</strong> '+x+'</div>').join('')}document.getElementById('reset').onclick=()=>{seq=[];render();document.getElementById('fb').className='feedback';document.getElementById('next').disabled=true};document.getElementById('next').onclick=()=>next('m6')}</script></body></html>
