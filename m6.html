<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rakit Siklus</title><link rel="stylesheet" href="style.css"><body><main><header>💧 AQUA-CYCLE <b>LAB 3.0</b><span id=xp></span></header><div class=bar><i id=p></i></div><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:15px"><span class="option" style="padding:7px;font-size:11px">1. Mulai</span><span class="option" style="padding:7px;font-size:11px">2. Eksplorasi</span><span class="option" style="padding:7px;font-size:11px">3. Evaporasi</span><span class="option" style="padding:7px;font-size:11px">4. Kondensasi</span><span class="option" style="padding:7px;font-size:11px">5. Hujan</span><span class="option" style="padding:7px;font-size:11px">6. Daratan</span><span class="option" style="padding:7px;font-size:11px">7. Rakit</span><span class="option" style="padding:7px;font-size:11px">8. Detektif</span><span class="option" style="padding:7px;font-size:11px">9. Final</span></div><section class=card><small>MISI 6 · CYCLE BUILDER</small><h2>Rakit siklus air 🧩</h2><p>Klik kartu dalam urutan yang benar.</p><div id=ch><div class=option data-s=e>☀️ Evaporasi</div><div class=option data-s=c>☁️ Kondensasi</div><div class=option data-s=p>🌧️ Presipitasi</div><div class=option data-s=i>🌱 Infiltrasi</div><div class=option data-s=r>🏞️ Aliran permukaan</div><div class=option data-s=k>💧 Pengumpulan</div></div><p id=seq></p><button id=ck>Cek Urutan</button><div id=f></div></section></main><script src=app.js></script><script>guard('m5');let want=['e','c','p','i','r','k'],arr=[];document.querySelectorAll('#ch .option').forEach(x=>x.onclick=()=>{if(!arr.includes(x.dataset.s)){arr.push(x.dataset.s);x.classList.add('selected');seq.textContent=arr.join(' → ')}});ck.onclick=()=>{if(JSON.stringify(arr)==JSON.stringify(want)){done('m6',30);f.className='feedback ok';f.textContent='Urutan benar!';go('m7')}else{f.className='feedback bad';f.textContent='Coba lagi dari awal. Ingat urutan prosesnya.';arr=[];seq.textContent=''}}</script></body></html>
