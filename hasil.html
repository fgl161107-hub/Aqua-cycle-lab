<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hasil Akhir | AQUA-CYCLE LAB</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><div class="wrap"><div class="brand">AQUA-CYCLE LAB<small>Hasil Pembelajaran</small></div><div><span id="player"></span> · <span id="xp"></span></div></div><div class="progress"><span style="width:100%"></span></div></header><main class="wrap"><section class="card result"><div class="stage">Perjalanan Selesai</div><h2>Hasil Pembelajaran</h2><p class="lead" style="margin-left:auto;margin-right:auto">Berikut ringkasan capaianmu setelah menyelesaikan seluruh rangkaian AQUA-CYCLE LAB.</p><div class="score" id="score">0/5</div><div id="badge" class="badge">Penjelajah Siklus Air</div><div class="grid3" style="margin-top:28px;text-align:left"><div class="info"><strong>Peserta</strong><span id="name"></span></div><div class="info"><strong>XP</strong><span id="xp2"></span></div><div class="info"><strong>Tahap selesai</strong><span>8 dari 8</span></div></div><div class="card" style="box-shadow:none;text-align:left;margin-top:22px"><h3>Refleksi Capaian</h3><p id="feedback"></p></div><div class="actions" style="justify-content:center"><button class="btn" onclick="window.print()">Cetak Hasil</button><button class="btn secondary" onclick="reset()">Mulai Ulang</button></div></section><p class="footer">AQUA-CYCLE LAB · Media pembelajaran IPA kelas V</p></main><script src="app.js"></script><script>if(!state().completed.includes('m8'))go('m8');else{const s=state();header(8);document.getElementById('name').textContent=s.name;document.getElementById('xp2').textContent=s.xp+' XP';document.getElementById('score').textContent=(s.score||0)+'/5';document.getElementById('feedback').textContent=(s.score||0)>=4?'Pemahaman sangat baik. Kamu mampu menjelaskan proses utama siklus air dan menerapkannya pada situasi sederhana.':(s.score||0)>=3?'Pemahaman baik. Beberapa konsep perlu diperkuat kembali melalui pengamatan dan latihan.':'Pemahaman masih perlu diperkuat. Tinjau kembali hubungan antara evaporasi, kondensasi, presipitasi, dan pergerakan air di daratan.'}</script></body></html>
