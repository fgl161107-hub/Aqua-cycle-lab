<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Presipitasi</title><link rel="stylesheet" href="style.css"><body><main><header>💧 AQUA-CYCLE <b>LAB 3.0</b><span id=xp></span></header><div class=bar><i id=p></i></div><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:15px"><span class="option" style="padding:7px;font-size:11px">1. Mulai</span><span class="option" style="padding:7px;font-size:11px">2. Eksplorasi</span><span class="option" style="padding:7px;font-size:11px">3. Evaporasi</span><span class="option" style="padding:7px;font-size:11px">4. Kondensasi</span><span class="option" style="padding:7px;font-size:11px">5. Hujan</span><span class="option" style="padding:7px;font-size:11px">6. Daratan</span><span class="option" style="padding:7px;font-size:11px">7. Rakit</span><span class="option" style="padding:7px;font-size:11px">8. Detektif</span><span class="option" style="padding:7px;font-size:11px">9. Final</span></div><section class=card><small>MISI 4 · RAIN MISSION</small><h2>Buat awan menghasilkan hujan 🌧️</h2><p>Tambahkan air sampai awan jenuh.</p><div class=scene id=rain>☁️</div><p>Muatan: <b id=n>0</b>/5</p><button id=a>💧 Tambahkan Air</button><div id=f></div></section></main><script src=app.js></script><script>guard('m3');let q=0;a.onclick=()=>{if(q<5)q++;n.textContent=q;if(q==5){rain.innerHTML='☁️<br>💧 💧 💧 💧 💧<br>🌧️🌧️🌧️🌧️🌧️';done('m4',25);f.className='feedback ok';f.textContent='Awan jenuh menghasilkan presipitasi seperti hujan.';go('m5')}}</script></body></html>
