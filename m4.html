<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tahap 4 | Presipitasi</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><div class="wrap"><div class="brand">AQUA-CYCLE LAB<small>Perjalanan Pembelajaran IPA</small></div><div><span id="player"></span> · <span id="xp"></span></div></div><div class="progress"><span id="bar"></span></div></header><main class="wrap"><div class="stage">Tahap 4 dari 8 · Simulasi</div><section class="card"><h2>Simulasi Pembentukan Hujan</h2><p class="lead">Tambahkan titik air ke awan. Ketika awan sudah cukup jenuh, air akan jatuh sebagai presipitasi.</p><div class="info"><strong>Jumlah titik air di awan: <span id="count">0</span>/6</strong><div class="meter" style="margin-top:10px"><span id="meter"></span></div></div><div class="actions"><button class="btn" id="add">Tambahkan Titik Air</button></div><div id="fb" class="feedback"></div><div class="actions"><button class="btn" id="next" disabled>Lanjut ke Perjalanan Air di Daratan</button></div></section></main><script src="app.js"></script><script>if(guard('m4')){header(4);let c=0;document.getElementById('add').onclick=()=>{c++;document.getElementById('count').textContent=c;document.getElementById('meter').style.width=(c/6*100)+'%';if(c>=6){document.getElementById('fb').className='feedback show ok';document.getElementById('fb').textContent='Awan telah mencapai kondisi jenuh. Air dapat turun ke permukaan sebagai presipitasi.';document.getElementById('add').disabled=true;document.getElementById('next').disabled=false}};document.getElementById('next').onclick=()=>next('m4')}</script></body></html>
