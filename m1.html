<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eksplorasi</title><link rel="stylesheet" href="style.css"><body><main><header>💧 AQUA-CYCLE <b>LAB 3.0</b><span id=xp></span></header><div class=bar><i id=p></i></div><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:15px"><span class="option" style="padding:7px;font-size:11px">1. Mulai</span><span class="option" style="padding:7px;font-size:11px">2. Eksplorasi</span><span class="option" style="padding:7px;font-size:11px">3. Evaporasi</span><span class="option" style="padding:7px;font-size:11px">4. Kondensasi</span><span class="option" style="padding:7px;font-size:11px">5. Hujan</span><span class="option" style="padding:7px;font-size:11px">6. Daratan</span><span class="option" style="padding:7px;font-size:11px">7. Rakit</span><span class="option" style="padding:7px;font-size:11px">8. Detektif</span><span class="option" style="padding:7px;font-size:11px">9. Final</span></div><section class=card><small>MISI 1 · EKSPLORASI</small><h2>Temukan 3 tetes air 🔎</h2><p>Klik tiga tetes air yang tersembunyi.</p><div class=scene id=s>☀️　☁️　<span class=drop>💧</span>　☁️<br><br>💧　　　　　　💧<br><br>🌊🌊🌊🌊🌊</div><p id=c>Ditemukan 0/3</p><div id=f></div></section></main><script src=app.js></script><script>guard('start');let n=0;document.querySelectorAll('.drop').forEach(x=>x.onclick=()=>{if(x.dataset.x)return;x.dataset.x=1;x.style.opacity=.2;n++;c.textContent=`Ditemukan ${n}/3`;if(n==3){done('m1',20);f.className='feedback ok';f.textContent='Berhasil! Sekarang masuk ke Water Lab.';go('m2')}})</script></body></html>
