<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Evaporasi</title><link rel="stylesheet" href="style.css"><body><main><header>💧 AQUA-CYCLE <b>LAB 3.0</b><span id=xp></span></header><div class=bar><i id=p></i></div><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:15px"><span class="option" style="padding:7px;font-size:11px">1. Mulai</span><span class="option" style="padding:7px;font-size:11px">2. Eksplorasi</span><span class="option" style="padding:7px;font-size:11px">3. Evaporasi</span><span class="option" style="padding:7px;font-size:11px">4. Kondensasi</span><span class="option" style="padding:7px;font-size:11px">5. Hujan</span><span class="option" style="padding:7px;font-size:11px">6. Daratan</span><span class="option" style="padding:7px;font-size:11px">7. Rakit</span><span class="option" style="padding:7px;font-size:11px">8. Detektif</span><span class="option" style="padding:7px;font-size:11px">9. Final</span></div><section class=card><small>MISI 2 · WATER LAB</small><h2>Eksperimen Evaporasi 🔬</h2><p>Atur panas dan angin, lalu jalankan eksperimen.</p><div class=grid><div class=lab>Panas <b id=hv>50</b>%<input id=h type=range min=0 max=100 value=50>Angin <b id=wv>30</b>%<input id=w type=range min=0 max=100 value=30><button id=run>▶ Jalankan</button></div><div class=machine><div class=liquid id=l></div></div></div><p id=o></p><div id=f></div></section></main><script src=app.js></script><script>guard('m1');h.oninput=()=>hv.textContent=h.value;w.oninput=()=>wv.textContent=w.value;run.onclick=()=>{let loss=Math.min(80,10+h.value*.55+w.value*.2);l.style.height=(100-loss)+'%';o.textContent='Air berubah menjadi uap lebih cepat saat pemanasan meningkat.';done('m2',25);f.className='feedback ok';f.textContent='Eksperimen selesai! Lanjut ke kondensasi.';go('m3')}</script></body></html>
