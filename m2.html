<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tahap 2 | Evaporasi</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><div class="wrap"><div class="brand">AQUA-CYCLE LAB<small>Perjalanan Pembelajaran IPA</small></div><div><span id="player"></span> · <span id="xp"></span></div></div><div class="progress"><span id="bar"></span></div></header><main class="wrap"><div class="stage">Tahap 2 dari 8 · Eksperimen</div><section class="card"><h2>Eksperimen Evaporasi</h2><p class="lead">Uji bagaimana energi panas memengaruhi proses penguapan.</p><div class="rangebox"><div>Suhu permukaan</div><div class="value"><span id="temp">20</span>°C</div><input id="r" type="range" min="20" max="100" value="20"><p id="obs">Atur suhu dan amati perubahan yang terjadi.</p></div><div class="meter" style="margin-top:18px"><span id="meter"></span></div><div id="fb" class="feedback"></div><div class="actions"><button class="btn" id="next" disabled>Jadikan Hasil Eksperimen</button></div></section></main><script src="app.js"></script><script>if(guard('m2')){header(2);const r=document.getElementById('r'),t=document.getElementById('temp'),m=document.getElementById('meter'),o=document.getElementById('obs'),n=document.getElementById('next');r.oninput=()=>{t.textContent=r.value;m.style.width=Math.max(0,(r.value-20)/80*100)+'%';o.textContent=r.value<50?'Penguapan masih relatif rendah.':'Energi panas semakin besar sehingga penguapan semakin mudah diamati.';if(+r.value>=80){document.getElementById('fb').className='feedback show ok';document.getElementById('fb').textContent='Hasil pengamatan: peningkatan energi panas memperbesar kecenderungan air untuk menguap.';n.disabled=false}};n.onclick=()=>{let s=state();s.experiments++;save(s);next('m2')}}</script></body></html>
